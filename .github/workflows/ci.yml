name: CI

# Terraform 정적 검증 CI.
# AWS 자격증명이 필요 없는 검증만 수행한다: fmt, init(-backend=false), validate, tflint.
# 실제 plan / drift / apply 는 OIDC role 과 backend 가 확정된 뒤 별도 workflow(plan.yml/apply.yml)에서 다룬다.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.15.8"

jobs:
  sensitive:
    name: Sensitive Info Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 공개 저장소 민감 정보 검사
        run: bash scripts/check-sensitive.sh

      - name: 민감 정보 검사 회귀 테스트
        run: bash scripts/test-check-sensitive.sh

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    env:
      # 버전과 체크섬을 고정한다(gitleaks_<버전>_checksums.txt의 linux_x64 값). 올릴 때 둘 다 바꾼다
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks-action은 조직 저장소에 라이선스 키를 요구하므로 바이너리를 직접 받아 실행한다
      - name: gitleaks 설치
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks

      - name: 이력 전체 비밀값 검사
        run: ./gitleaks git --redact --no-banner -v .

  fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # bootstrap, envs/*, modules/* 하위의 Terraform root 를 자동 탐색해 검증한다.
      # backend/provider 자격증명 없이 검증하기 위해 -backend=false 로 init 한다.
      - name: terraform validate (all roots)
        run: |
          set -euo pipefail
          shopt -s nullglob

          # *.tf 를 포함하는 디렉터리를 root 후보로 수집 (modules 포함).
          mapfile -t dirs < <(find bootstrap envs modules -type f -name '*.tf' 2>/dev/null \
            | xargs -r -n1 dirname | sort -u)

          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "검증할 Terraform root 가 아직 없습니다. 스킵합니다."
            exit 0
          fi

          rc=0
          for d in "${dirs[@]}"; do
            echo "::group::validate ${d}"
            # 잠금 파일이 커밋된 root는 잠금 파일을 바꾸지 않고 검증한다(체크섬 불일치 시 실패).
            lock_opt=""
            if [ -f "${d}/.terraform.lock.hcl" ]; then lock_opt="-lockfile=readonly"; fi
            if terraform -chdir="${d}" init -backend=false -input=false -no-color ${lock_opt}; then
              terraform -chdir="${d}" validate -no-color || rc=1
            else
              echo "init 실패: ${d}"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    env:
      # .tflint.hcl의 required_version과 함께 올린다
      TFLINT_VERSION: "v0.64.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      # 플러그인 설치 실패를 무시하지 않는다(무시하면 AWS 규칙 없이 통과함).
      # --recursive에서 모든 디렉터리가 저장소 루트 설정을 쓰도록 절대 경로로 지정한다.
      - name: Run TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"
          tflint --recursive --config "${GITHUB_WORKSPACE}/.tflint.hcl" --no-color
