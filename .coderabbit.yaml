language: "ko-KR" # 리뷰 언어 설정
tone_instructions: "친근하고 건설적인 피드백을 주세요. 문제점 지적보다는 개선 방향을 제안하는 톤으로 작성해주세요."

reviews:
  profile: "chill" # 리뷰 스타일 (chill, assertive 중 선택)
  request_changes_workflow: false # AI가 직접 'Changes Requested' 상태를 변경할지 여부
  high_level_summary: true # PR의 전체적인 요약 생성
  high_level_summary_instructions: |
    변경 사항을 아래 형식으로 간결하게 요약해주세요:
    - **변경 목적**: (1~2 문장)
    - **주요 변경 내용**: (bullet list, 스택/모듈 기준 - bootstrap / envs/prod / modules/*)
    - **영향 범위**: 관리 리소스 변경 / state·backend 변경 / IAM·보안 변경 / season_mode 변경 / 문서 변경 여부
  review_status: true
  collapse_walkthrough: true   # 변경 사항 요약 코멘트 토글로 표시
  assess_linked_issues: true  # PR에 연결된 이슈를 분석하여 리뷰에 활용할지 여부
  related_issues: false # 연관된 다른 이슈를 찾아서 링크할지 여부
  related_prs: false # 연관된 다른 PR을 찾아서 링크할지 여부
  poem: false # 불필요한 감성적 요소(시 등) 제거

  # 머지 전 점검: 함수 docstring 비율 점검은 끔(Terraform·짧은 셸 스크립트 위주라 의미 없음). 나머지 점검은 기본값 유지
  pre_merge_checks:
    docstrings:
      mode: "off"

  # 자동 리뷰 트리거 설정
  auto_review:
    # PR이 생성됐을 때 자동으로 리뷰 시작
    enabled: true
    # 이미 리뷰가 진행된 PR에 새로운 커밋이 추가될 때, 변경된 부분만 자동으로 리뷰할지 여부
    auto_incremental_review: true
    drafts: false

  # 리뷰 제외 파일
  path_filters:
    - "!**/*.lock"
    - "!**/.terraform/**"            # Terraform 로컬 캐시/플러그인
    - "!**/*.tfstate"               # state 파일 (민감·자동 생성)
    - "!**/*.tfstate.*"
    - "!**/*.tfplan"                # plan 바이너리
    - "!**/*.tfvars"                # 변수 값(민감 가능) — 리뷰 대상에서 제외
    - "!**/.terraform.lock.hcl"     # provider lock (자동 생성)

  # 인프라(Terraform) 특화 프롬프트 지침
  instructions: |
    당신은 숙련된 인프라/DevOps 엔지니어입니다. 이 저장소는 운영 AWS 인프라를 Terraform으로
    관리하는 lift-and-codify 프로젝트입니다. 다음 기준으로 리뷰하십시오:

    1. **안전성 우선**: plan에 운영 리소스의 destroy/replace가 유발될 수 있는 변경(리소스 이름·식별자
       변경, lifecycle 누락 등)을 최우선으로 지적하세요. RDS/EC2/CloudFront/Route53/S3 등 보호
       대상에는 `prevent_destroy`가 유지되는지 확인하세요.
    2. **시크릿/민감정보**: DB password, 토큰, 계정 키 등이 코드·tfvars·output·plan에 평문으로
       노출되지 않는지, 민감 변수에 `sensitive = true`가 지정됐는지 확인하세요.
    3. **모듈 설계**: 계정 ID·리전·리소스 ID가 모듈에 하드코딩되지 않고 변수로 주입되는지, SG 규칙이
       인라인 블록이 아니라 개별 `aws_vpc_security_group_ingress_rule`/`egress_rule`로 정의되는지 확인하세요.
    4. **import 정합성**: 기존 리소스는 재생성이 아니라 `import`로 편입되어야 하며, 동일 커밋 plan이
       "No changes"에 수렴하는지 관점에서 검토하세요.
    5. **season_mode**: off/on 전환이 canonical 모델과 일치하는지, CloudFront origin 교체·ALB
       생성/삭제 순서(전파 안전성)가 깨지지 않는지 확인하세요.
    6. **계약 보존**: 기존 배포 workflow가 참조하는 버킷명·CloudFront ID·role ARN·CodeDeploy 앱/그룹명이
       바뀌지 않는지 확인하세요.
    7. **공개 저장소 보안 정보**: 이 저장소는 공개 저장소입니다. 코드·문서 어디에든 공인 IP 주소(개인·서버,
       EC2 퍼블릭 DNS 포함), SSH 허용 IP, 시크릿·토큰·액세스 키·개인 키, 개인 계정명이 있으면 Critical로
       지적하세요. AWS 계정 ID·계정 ID가 든 ARN·자원 ID(vpc-, subnet-, sg-, i-, eipalloc-, CloudFront·Route53 ID 등)는
       `docs/records/` 밖에 있으면 지적하고 역할명으로 바꾸도록 제안하세요. 규칙: README.md "보안 정보 공개 금지".
    8. 사소한 스타일 이슈는 개별 코멘트 대신 모아서 요약하고, Critical한 이슈(보안·삭제 위험) 위주로
       라인 코멘트를 남겨주세요. 리뷰는 해당 라인 범위의 코멘트에 작성해주세요.

# 도구별 설정 (Chat 및 자동 수정 기능)
chat:
  auto_reply: true

# 지식 베이스 설정
knowledge_base:
  opt_out: false
  web_search:
    enabled: true              # Terraform/AWS provider 최신 문서·CVE 등 웹 검색 활용
  learnings:
    scope: auto                # 리뷰 피드백에서 자동 학습
